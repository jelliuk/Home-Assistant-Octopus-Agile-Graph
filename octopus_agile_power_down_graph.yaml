type: custom:config-template-card

entities:
  # Replace these entity IDs with your own.
  - sensor.octopus_energy_electricity_your_mpan_your_meter_serial_current_rate
  - sensor.octopus_energy_electricity_your_mpan_your_meter_serial_next_rate
  - event.octopus_energy_electricity_your_mpan_your_meter_serial_current_day_rates
  - event.octopus_energy_electricity_your_mpan_your_meter_serial_next_day_rates
  - sensor.octopus_energy_electricity_your_mpan_your_meter_serial_current_accumulative_consumption
  - calendar.octopus_energy_your_account_id_octoplus_power_down
  - calendar.octopus_energy_your_account_id_octoplus_saving_sessions
  - calendar.octopus_energy_your_account_id_octoplus_power_up
  - calendar.octopus_energy_your_account_id_octoplus_free_electricity_session

variables:

  # =============================================================
  # THEME COLOURS
  # =============================================================

  APPLE_BLUE: |
    this.hass.themes.darkMode
      ? '#0A84FF'
      : '#007AFF'

  APPLE_CYAN: |
    this.hass.themes.darkMode
      ? '#64D2FF'
      : '#32ADE6'

  APPLE_GREEN: |
    this.hass.themes.darkMode
      ? '#30D158'
      : '#34C759'

  APPLE_ORANGE: |
    this.hass.themes.darkMode
      ? '#FF9F0A'
      : '#FF9500'

  APPLE_RED: |
    this.hass.themes.darkMode
      ? '#FF453A'
      : '#FF3B30'

  APPLE_PURPLE: |
    this.hass.themes.darkMode
      ? '#BF5AF2'
      : '#AF52DE'

  APPLE_YELLOW: |
    this.hass.themes.darkMode
      ? '#FFD60A'
      : '#FFCC00'

  APPLE_INDIGO: |
    this.hass.themes.darkMode
      ? '#5E5CE6'
      : '#5856D6'

  POWER_DOWN_OPACITY: |
    this.hass.themes.darkMode
      ? 0.14
      : 0.09

  POWER_UP_OPACITY: |
    this.hass.themes.darkMode
      ? 0.14
      : 0.09


  # =============================================================
  # POWER DOWN SESSION SHOWN ON GRAPH
  # =============================================================

  POWER_DOWN_SESSION: |
    (() => {
      const primary =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_power_down'
        ];

      // Older Octopus Energy integration versions (and accounts not
      // yet migrated) expose the same information under the legacy
      // "Saving Sessions" calendar instead.
      const legacy =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_saving_sessions'
        ];

      const entity =
        primary !== undefined
          ? primary
          : legacy;

      const startRaw =
        entity?.attributes?.start_time;

      const endRaw =
        entity?.attributes?.end_time;

      const start =
        startRaw
          ? new Date(startRaw).getTime()
          : NaN;

      const end =
        endRaw
          ? new Date(endRaw).getTime()
          : NaN;

      if (
        !Number.isFinite(start) ||
        !Number.isFinite(end)
      ) {
        return {
          visible: false,
          start: 0,
          end: 0
        };
      }

      // Truncate to midnight, matching the card's
      // span: { start: day } setting below.
      const graphStartDate =
        new Date();

      graphStartDate.setHours(
        0,
        0,
        0,
        0
      );

      const graphStart =
        graphStartDate.getTime();

      const graphEnd =
        graphStart +
        (24 * 60 * 60 * 1000);

      // The calendar entity only ever exposes the current or next
      // session, so there is at most one session to test here.
      if (
        end < graphStart ||
        start > graphEnd
      ) {
        return {
          visible: false,
          start: 0,
          end: 0
        };
      }

      return {
        visible: true,
        start,
        end
      };
    })()


  # =============================================================
  # POWER UP SESSION SHOWN ON GRAPH
  # =============================================================

  POWER_UP_SESSION: |
    (() => {
      const primary =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_power_up'
        ];

      // Older Octopus Energy integration versions (and accounts not
      // yet migrated) expose the same information under the legacy
      // "Free Electricity Session" calendar instead.
      const legacy =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_free_electricity_session'
        ];

      const entity =
        primary !== undefined
          ? primary
          : legacy;

      const startRaw =
        entity?.attributes?.start_time;

      const endRaw =
        entity?.attributes?.end_time;

      const start =
        startRaw
          ? new Date(startRaw).getTime()
          : NaN;

      const end =
        endRaw
          ? new Date(endRaw).getTime()
          : NaN;

      if (
        !Number.isFinite(start) ||
        !Number.isFinite(end)
      ) {
        return {
          visible: false,
          start: 0,
          end: 0
        };
      }

      // Truncate to midnight, matching the card's
      // span: { start: day } setting below.
      const graphStartDate =
        new Date();

      graphStartDate.setHours(
        0,
        0,
        0,
        0
      );

      const graphStart =
        graphStartDate.getTime();

      const graphEnd =
        graphStart +
        (24 * 60 * 60 * 1000);

      // The calendar entity only ever exposes the current or next
      // session, so there is at most one session to test here.
      if (
        end < graphStart ||
        start > graphEnd
      ) {
        return {
          visible: false,
          start: 0,
          end: 0
        };
      }

      return {
        visible: true,
        start,
        end
      };
    })()

  # =============================================================
  # IS POWER DOWN ACTIVE RIGHT NOW?
  # =============================================================

  POWER_DOWN_ACTIVE: |
    (() => {
      const primary =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_power_down'
        ];

      const legacy =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_saving_sessions'
        ];

      const entity =
        primary !== undefined
          ? primary
          : legacy;

      // The calendar entity's state is 'on' whenever a joined
      // Power Down session is currently in progress.
      return entity?.state === 'on';
    })()


  # =============================================================
  # IS POWER UP ACTIVE RIGHT NOW?
  # =============================================================

  POWER_UP_ACTIVE: |
    (() => {
      const primary =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_power_up'
        ];

      const legacy =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_free_electricity_session'
        ];

      const entity =
        primary !== undefined
          ? primary
          : legacy;

      // The calendar entity's state is 'on' whenever a joined
      // Power Up session is currently in progress.
      return entity?.state === 'on';
    })()


  # =============================================================
  # IS THE NEXT HALF-HOUR SLOT INSIDE POWER DOWN?
  # =============================================================

  NEXT_POWER_DOWN: |
    (() => {
      const primary =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_power_down'
        ];

      const legacy =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_saving_sessions'
        ];

      const entity =
        primary !== undefined
          ? primary
          : legacy;

      const startRaw =
        entity?.attributes?.start_time;

      const endRaw =
        entity?.attributes?.end_time;

      const sessionStart =
        startRaw
          ? new Date(startRaw).getTime()
          : NaN;

      const sessionEnd =
        endRaw
          ? new Date(endRaw).getTime()
          : NaN;

      if (
        !Number.isFinite(sessionStart) ||
        !Number.isFinite(sessionEnd)
      ) {
        return false;
      }

      const slotLength =
        30 * 60 * 1000;

      const nextStart =
        (
          Math.floor(
            Date.now() / slotLength
          ) + 1
        ) * slotLength;

      const nextEnd =
        nextStart + slotLength;

      return (
        nextStart < sessionEnd &&
        nextEnd > sessionStart
      );
    })()


  # =============================================================
  # IS THE NEXT HALF-HOUR SLOT INSIDE POWER UP?
  # =============================================================

  NEXT_POWER_UP: |
    (() => {
      const primary =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_power_up'
        ];

      const legacy =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_free_electricity_session'
        ];

      const entity =
        primary !== undefined
          ? primary
          : legacy;

      const startRaw =
        entity?.attributes?.start_time;

      const endRaw =
        entity?.attributes?.end_time;

      const sessionStart =
        startRaw
          ? new Date(startRaw).getTime()
          : NaN;

      const sessionEnd =
        endRaw
          ? new Date(endRaw).getTime()
          : NaN;

      if (
        !Number.isFinite(sessionStart) ||
        !Number.isFinite(sessionEnd)
      ) {
        return false;
      }

      const slotLength =
        30 * 60 * 1000;

      const nextStart =
        (
          Math.floor(
            Date.now() / slotLength
          ) + 1
        ) * slotLength;

      const nextEnd =
        nextStart + slotLength;

      return (
        nextStart < sessionEnd &&
        nextEnd > sessionStart
      );
    })()


  # =============================================================
  # DYNAMIC CONSUMPTION AXIS MAX
  # =============================================================

  CONSUMPTION_MAX: |
    (() => {
      const entity =
        states[
          'sensor.octopus_energy_electricity_your_mpan_your_meter_serial_current_accumulative_consumption'
        ];

      const charges =
        Array.isArray(entity?.attributes?.charges)
          ? entity.attributes.charges
          : [];

      const values =
        charges
          .map((entry) =>
            Number(entry.consumption)
          )
          .filter((value) =>
            Number.isFinite(value)
          );

      const peak =
        values.length
          ? Math.max(...values)
          : 0;

      // A floor so a very quiet day doesn't zoom the axis in so
      // far that normal noise looks dramatic, and some headroom
      // above the peak so the line doesn't touch the top of the
      // chart. Tune these two numbers to taste.
      const AXIS_FLOOR_KWH = 1;

      const HEADROOM_MULTIPLIER = 1.2;

      return Math.max(
        AXIS_FLOOR_KWH,
        peak * HEADROOM_MULTIPLIER
      );
    })()


  # =============================================================
  # CURRENT PRICE COLOUR
  # =============================================================

  CURRENT_COLOR: |
    (() => {
      const raw =
        Number(
          states[
            'sensor.octopus_energy_electricity_your_mpan_your_meter_serial_current_rate'
          ]?.state
        );

      const price =
        Number.isFinite(raw)
          ? raw * 100
          : 0;

      const dark =
        this.hass.themes.darkMode;

      const BLUE =
        dark
          ? '#0A84FF'
          : '#007AFF';

      const CYAN =
        dark
          ? '#64D2FF'
          : '#32ADE6';

      const GREEN =
        dark
          ? '#30D158'
          : '#34C759';

      const ORANGE =
        dark
          ? '#FF9F0A'
          : '#FF9500';

      const RED =
        dark
          ? '#FF453A'
          : '#FF3B30';

      const clamp =
        (value, min, max) =>
          Math.min(
            Math.max(
              value,
              min
            ),
            max
          );

      const mix =
        (a, b, t) => {
          const ah =
            parseInt(
              a.slice(1),
              16
            );

          const bh =
            parseInt(
              b.slice(1),
              16
            );

          const ar =
            (ah >> 16) & 255;

          const ag =
            (ah >> 8) & 255;

          const ab =
            ah & 255;

          const br =
            (bh >> 16) & 255;

          const bg =
            (bh >> 8) & 255;

          const bb =
            bh & 255;

          const r =
            Math.round(
              ar +
              (br - ar) *
              t
            );

          const g =
            Math.round(
              ag +
              (bg - ag) *
              t
            );

          const bl =
            Math.round(
              ab +
              (bb - ab) *
              t
            );

          return (
            '#' +
            (
              (1 << 24) +
              (r << 16) +
              (g << 8) +
              bl
            )
              .toString(16)
              .slice(1)
          );
        };

      if (price < 0) {
        const t =
          clamp(
            Math.abs(price) / 7,
            0,
            1
          );

        return mix(
          CYAN,
          BLUE,
          t
        );
      }

      if (price < 5) {
        return GREEN;
      }

      if (price < 20) {
        const t =
          clamp(
            (price - 5) / 15,
            0,
            1
          );

        return mix(
          GREEN,
          ORANGE,
          t
        );
      }

      if (price < 30) {
        const t =
          clamp(
            (price - 20) / 10,
            0,
            1
          );

        return mix(
          ORANGE,
          RED,
          t
        );
      }

      return RED;
    })()


  # =============================================================
  # NEXT PRICE COLOUR
  # =============================================================

  NEXT_COLOR: |
    (() => {
      const raw =
        Number(
          states[
            'sensor.octopus_energy_electricity_your_mpan_your_meter_serial_next_rate'
          ]?.state
        );

      const price =
        Number.isFinite(raw)
          ? raw * 100
          : 0;

      const dark =
        this.hass.themes.darkMode;

      const BLUE =
        dark
          ? '#0A84FF'
          : '#007AFF';

      const CYAN =
        dark
          ? '#64D2FF'
          : '#32ADE6';

      const GREEN =
        dark
          ? '#30D158'
          : '#34C759';

      const ORANGE =
        dark
          ? '#FF9F0A'
          : '#FF9500';

      const RED =
        dark
          ? '#FF453A'
          : '#FF3B30';

      const clamp =
        (value, min, max) =>
          Math.min(
            Math.max(
              value,
              min
            ),
            max
          );

      const mix =
        (a, b, t) => {
          const ah =
            parseInt(
              a.slice(1),
              16
            );

          const bh =
            parseInt(
              b.slice(1),
              16
            );

          const ar =
            (ah >> 16) & 255;

          const ag =
            (ah >> 8) & 255;

          const ab =
            ah & 255;

          const br =
            (bh >> 16) & 255;

          const bg =
            (bh >> 8) & 255;

          const bb =
            bh & 255;

          const r =
            Math.round(
              ar +
              (br - ar) *
              t
            );

          const g =
            Math.round(
              ag +
              (bg - ag) *
              t
            );

          const bl =
            Math.round(
              ab +
              (bb - ab) *
              t
            );

          return (
            '#' +
            (
              (1 << 24) +
              (r << 16) +
              (g << 8) +
              bl
            )
              .toString(16)
              .slice(1)
          );
        };

      if (price < 0) {
        const t =
          clamp(
            Math.abs(price) / 7,
            0,
            1
          );

        return mix(
          CYAN,
          BLUE,
          t
        );
      }

      if (price < 5) {
        return GREEN;
      }

      if (price < 20) {
        const t =
          clamp(
            (price - 5) / 15,
            0,
            1
          );

        return mix(
          GREEN,
          ORANGE,
          t
        );
      }

      if (price < 30) {
        const t =
          clamp(
            (price - 20) / 10,
            0,
            1
          );

        return mix(
          ORANGE,
          RED,
          t
        );
      }

      return RED;
    })()


  # =============================================================
  # CURRENT HEADER LABEL
  # =============================================================

  CURRENT_LABEL: |
    (() => {
      const rateEntity =
        states[
          'sensor.octopus_energy_electricity_your_mpan_your_meter_serial_current_rate'
        ];

      const raw =
        Number(
          rateEntity?.state
        );

      const price =
        Number.isFinite(raw)
          ? raw * 100
          : 0;

      const validFrom =
        rateEntity?.attributes?.rate?.valid_from ??
        rateEntity?.attributes?.valid_from;

      let currentDate =
        validFrom
          ? new Date(validFrom)
          : null;

      if (
        !currentDate ||
        Number.isNaN(
          currentDate.getTime()
        )
      ) {
        currentDate =
          new Date();

        currentDate.setSeconds(
          0,
          0
        );

        currentDate.setMinutes(
          currentDate.getMinutes() < 30
            ? 0
            : 30
        );
      }

      const currentTime =
        currentDate.toLocaleTimeString(
          'en-GB',
          {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          }
        );

      const powerDownPrimary =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_power_down'
        ];

      const powerDownLegacy =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_saving_sessions'
        ];

      const powerDownEntity =
        powerDownPrimary !== undefined
          ? powerDownPrimary
          : powerDownLegacy;

      const powerDownActive =
        powerDownEntity?.state === 'on';

      const powerUpPrimary =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_power_up'
        ];

      const powerUpLegacy =
        states[
          'calendar.octopus_energy_your_account_id_octoplus_free_electricity_session'
        ];

      const powerUpEntity =
        powerUpPrimary !== undefined
          ? powerUpPrimary
          : powerUpLegacy;

      const powerUpActive =
        powerUpEntity?.state === 'on';

      if (powerDownActive) {
        return 'NOW · ' + currentTime + ' · POWER DOWN';
      }

      if (powerUpActive) {
        return 'NOW · ' + currentTime + ' · POWER UP';
      }

      if (price <= 0) {
        return 'NOW · ' + currentTime + ' · FREE';
      }

      return 'NOW · ' + currentTime;
    })()


  # =============================================================
  # NEXT RATE TIME
  # =============================================================

  NEXT_TIME: |
    (() => {
      const entity =
        states[
          'sensor.octopus_energy_electricity_your_mpan_your_meter_serial_next_rate'
        ];

      const raw =
        entity?.attributes?.rate?.valid_from ??
        entity?.attributes?.valid_from;

      let date =
        raw
          ? new Date(raw)
          : null;

      if (
        !date ||
        Number.isNaN(
          date.getTime()
        )
      ) {
        date =
          new Date();

        date.setSeconds(
          0,
          0
        );

        date.setMinutes(
          date.getMinutes() < 30
            ? 30
            : 60
        );
      }

      return date.toLocaleTimeString(
        'en-GB',
        {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }
      );
    })()


card:
  type: custom:apexcharts-card

  show:
    loading: false

  update_interval: 1min

  graph_span: 24h

  span:
    start: day

  experimental:
    color_threshold: true

  header:
    show: true
    show_states: true
    colorize_states: true
    standard_format: false

  yaxis:
    - id: price
      min: auto
      max: '|+3|'
      decimals: 0

      apex_config:
        tickAmount: 6

        labels:
          formatter: |
            EVAL:function(value) {
              return Math.round(value) + 'p';
            }

    - id: consumption
      opposite: true
      decimals: 1

      # A fixed (not soft/auto) number is used deliberately here.
      # apexcharts-card has a known issue where auto/soft-bound
      # scaling on a second y-axis can pick up the range from the
      # first axis instead of its own data when the chart also has
      # header-only (in_chart: false) series - which this card does.
      # CONSUMPTION_MAX is computed once, up front, from today's
      # actual peak half-hour reading (see the variables section),
      # so the axis still adapts day-to-day without going through
      # that buggy calculation - a quiet day zooms in for detail,
      # while a 7 kWh spike day automatically gets more headroom.
      min: 0
      max: ${CONSUMPTION_MAX}

      apex_config:
        tickAmount: 4

        labels:
          formatter: |
            EVAL:function(value) {
              return value.toFixed(1) + ' kWh';
            }

  series:

    # Current rate - header only
    - entity: sensor.octopus_energy_electricity_your_mpan_your_meter_serial_current_rate

      name: ${CURRENT_LABEL}

      unit: p/kWh

      float_precision: 2

      yaxis_id: price

      transform: |
        return Number(x) * 100;

      color: "${POWER_DOWN_ACTIVE ? APPLE_PURPLE : (POWER_UP_ACTIVE ? APPLE_YELLOW : CURRENT_COLOR)}"

      show:
        in_header: true
        in_chart: false
        in_legend: false
        legend_value: false
        name_in_header: true


    # Next rate - header only
    - entity: sensor.octopus_energy_electricity_your_mpan_your_meter_serial_next_rate

      name: "${NEXT_POWER_DOWN ? 'NEXT · ' + NEXT_TIME + ' · POWER DOWN' : (NEXT_POWER_UP ? 'NEXT · ' + NEXT_TIME + ' · POWER UP' : 'NEXT · ' + NEXT_TIME)}"

      unit: p/kWh

      float_precision: 2

      yaxis_id: price

      transform: |
        return Number(x) * 100;

      color: "${NEXT_POWER_DOWN ? APPLE_PURPLE : (NEXT_POWER_UP ? APPLE_YELLOW : NEXT_COLOR)}"

      show:
        in_header: true
        in_chart: false
        in_legend: false
        legend_value: false
        name_in_header: true


    # Price area
    - entity: >-
        event.octopus_energy_electricity_your_mpan_your_meter_serial_current_day_rates

      name: Price

      unit: p/kWh

      float_precision: 2

      type: area

      curve: straight

      stroke_width: 0

      extend_to: false

      yaxis_id: price

      show:
        in_header: false
        in_legend: false
        legend_value: false

      data_generator: |
        const currentEntity =
          hass.states[
            'event.octopus_energy_electricity_your_mpan_your_meter_serial_current_day_rates'
          ];

        const nextEntity =
          hass.states[
            'event.octopus_energy_electricity_your_mpan_your_meter_serial_next_day_rates'
          ];

        const currentRates =
          Array.isArray(
            currentEntity?.attributes?.rates
          )
            ? currentEntity.attributes.rates
            : [];

        const nextRates =
          Array.isArray(
            nextEntity?.attributes?.rates
          )
            ? nextEntity.attributes.rates
            : [];

        const merged = [
          ...currentRates,
          ...nextRates
        ];

        if (!merged.length) {
          return [];
        }

        const byStart =
          new Map();

        merged.forEach((entry) => {
          const startTime =
            new Date(
              entry.start
            ).getTime();

          const endTime =
            new Date(
              entry.end
            ).getTime();

          const value =
            Number(
              entry.value_inc_vat
            ) * 100;

          if (
            Number.isFinite(startTime) &&
            Number.isFinite(value)
          ) {
            byStart.set(
              startTime,
              {
                start: startTime,

                end:
                  Number.isFinite(endTime)
                    ? endTime
                    : startTime +
                      (
                        30 *
                        60 *
                        1000
                      ),

                value
              }
            );
          }
        });

        const rates =
          Array
            .from(
              byStart.values()
            )
            .sort(
              (a, b) =>
                a.start - b.start
            );

        if (!rates.length) {
          return [];
        }

        const data =
          rates.map((entry) => {
            return [
              entry.start,
              entry.value
            ];
          });

        const last =
          rates[
            rates.length - 1
          ];

        data.push([
          last.end,
          last.value
        ]);

        return data;

      color_threshold:
        - value: -7
          color: ${APPLE_BLUE}
          opacity: 0.16

        - value: -0.001
          color: ${APPLE_CYAN}
          opacity: 0.16

        - value: 0
          color: ${APPLE_GREEN}
          opacity: 0.16

        - value: 5
          color: ${APPLE_GREEN}
          opacity: 0.16

        - value: 20
          color: ${APPLE_ORANGE}
          opacity: 0.16

        - value: 30
          color: ${APPLE_RED}
          opacity: 0.16


    # Current-day price line
    - entity: >-
        event.octopus_energy_electricity_your_mpan_your_meter_serial_current_day_rates

      name: Price

      type: line

      curve: straight

      stroke_width: 3

      extend_to: false

      yaxis_id: price

      show:
        in_header: false
        in_legend: false
        legend_value: false

      data_generator: |
        const rates =
          Array.isArray(
            entity.attributes.rates
          )
            ? entity.attributes.rates
            : [];

        if (!rates.length) {
          return [];
        }

        const data =
          rates.map((entry) => {
            return [
              new Date(
                entry.start
              ).getTime(),

              Number(
                entry.value_inc_vat
              ) * 100
            ];
          });

        const last =
          rates[
            rates.length - 1
          ];

        data.push([
          new Date(
            last.end
          ).getTime(),

          Number(
            last.value_inc_vat
          ) * 100
        ]);

        return data;

      color_threshold:
        - value: -7
          color: ${APPLE_BLUE}

        - value: -0.001
          color: ${APPLE_CYAN}

        - value: 0
          color: ${APPLE_GREEN}

        - value: 5
          color: ${APPLE_GREEN}

        - value: 20
          color: ${APPLE_ORANGE}

        - value: 30
          color: ${APPLE_RED}


    # Next-day price line
    - entity: >-
        event.octopus_energy_electricity_your_mpan_your_meter_serial_next_day_rates

      name: Price

      type: line

      curve: straight

      stroke_width: 3

      extend_to: false

      yaxis_id: price

      show:
        in_header: false
        in_legend: false
        legend_value: false

      data_generator: |
        const rates =
          Array.isArray(
            entity.attributes.rates
          )
            ? entity.attributes.rates
            : [];

        if (!rates.length) {
          return [];
        }

        const data =
          rates.map((entry) => {
            return [
              new Date(
                entry.start
              ).getTime(),

              Number(
                entry.value_inc_vat
              ) * 100
            ];
          });

        const last =
          rates[
            rates.length - 1
          ];

        data.push([
          new Date(
            last.end
          ).getTime(),

          Number(
            last.value_inc_vat
          ) * 100
        ]);

        return data;

      color_threshold:
        - value: -7
          color: ${APPLE_BLUE}

        - value: -0.001
          color: ${APPLE_CYAN}

        - value: 0
          color: ${APPLE_GREEN}

        - value: 5
          color: ${APPLE_GREEN}

        - value: 20
          color: ${APPLE_ORANGE}

        - value: 30
          color: ${APPLE_RED}


    # Today's cumulative consumption - secondary axis
    - entity: >-
        sensor.octopus_energy_electricity_your_mpan_your_meter_serial_current_accumulative_consumption

      name: Usage kWh

      type: line

      float_precision: 1

      yaxis_id: consumption

      stroke_width: 2

      color: ${APPLE_INDIGO}

      extend_to: now

      show:
        # "before_now" (rather than plain true) is required because
        # this series' data spans into the future (see the
        # data_generator below) - it tells apexcharts-card to use
        # the value at/just before the current time for the header,
        # instead of literally the last array entry, which would
        # often be one of the null future slots and show "N/A".
        in_header: before_now
        in_legend: false
        legend_value: false
        datalabels: false

      data_generator: |
        const charges =
          Array.isArray(
            entity.attributes.charges
          )
            ? entity.attributes.charges
            : [];

        const consumptionByTime = new Map();

        charges.forEach((entry) => {
          const time =
            new Date(entry.start).getTime();

          const value =
            Number(entry.consumption);

          if (
            Number.isFinite(time) &&
            Number.isFinite(value)
          ) {
            consumptionByTime.set(time, value);
          }
        });

        // Build a full half-hourly scaffold for today (48 slots)
        // instead of only returning the handful of slots we
        // actually have readings for. ApexCharts' shared tooltip
        // matches values across series by array position, and
        // requires every series to share the same x-values to work
        // reliably - the price series (below) also has 48 slots for
        // today, so lining these up exactly, index for index, is
        // what keeps the tooltip from breaking when hovering over
        // this line. Slots with no reading yet (typically anything
        // from "now" onwards) are left as null - extend_to: now
        // (below) then draws the visible line up to the current
        // time using the last real reading, exactly as before.
        const slotLength = 30 * 60 * 1000;

        const dayStart = new Date();

        dayStart.setHours(
          0,
          0,
          0,
          0
        );

        const dayStartTime =
          dayStart.getTime();

        const points = [];

        for (let i = 0; i < 48; i++) {
          const time =
            dayStartTime +
            (i * slotLength);

          points.push([
            time,
            consumptionByTime.has(time)
              ? consumptionByTime.get(time)
              : null
          ]);
        }

        return points;

  apex_config:

    chart:
      height: 190px
      background: transparent

      toolbar:
        show: false

    legend:
      show: false

    dataLabels:
      enabled: false

    markers:
      size: 0

      hover:
        size: 0
        sizeOffset: 0

    grid:
      borderColor: rgba(120, 120, 128, 0.18)

      strokeDashArray: 4

      padding:
        left: 12
        right: 4
        top: 2
        bottom: 0

    xaxis:
      type: datetime

      axisBorder:
        show: false

      axisTicks:
        show: false

      tickAmount: 8

      labels:
        datetimeUTC: false
        format: HH:mm

        style:
          fontSize: 11px
          fontWeight: 400

      tooltip:
        enabled: false

    tooltip:
      # Which series show a value row in the tooltip. The three
      # price series are numbered below;
      enabledOnSeries:
        - 0 # Price area
        - 1 # Current-day price line
        - 2 # Next-day price line
        - 3 # Usage kWh

      marker:
        show: false

      x:
        format: HH:mm

    annotations:
      xaxis:

        # Power Down window
        - x: ${POWER_DOWN_SESSION.start}
          x2: ${POWER_DOWN_SESSION.end}

          borderColor: ${APPLE_PURPLE}
          fillColor: ${APPLE_PURPLE}
          opacity: ${POWER_DOWN_OPACITY}

          label:
            text: "${POWER_DOWN_SESSION.visible ? 'POWER DOWN' : ''}"
            orientation: horizontal
            position: top
            offsetY: -26
            borderColor: ${APPLE_PURPLE}

            style:
              background: ${APPLE_PURPLE}
              color: '#FFFFFF'
              fontSize: 9px
              fontWeight: 600

        # Power Down start boundary
        - x: ${POWER_DOWN_SESSION.start}
          borderColor: ${APPLE_PURPLE}
          strokeDashArray: 0

        # Power Down end boundary
        - x: ${POWER_DOWN_SESSION.end}
          borderColor: ${APPLE_PURPLE}
          strokeDashArray: 0

        # Power Up window
        - x: ${POWER_UP_SESSION.start}
          x2: ${POWER_UP_SESSION.end}

          borderColor: ${APPLE_YELLOW}
          fillColor: ${APPLE_YELLOW}
          opacity: ${POWER_UP_OPACITY}

          label:
            text: "${POWER_UP_SESSION.visible ? 'POWER UP' : ''}"
            orientation: horizontal
            position: top
            offsetY: -26
            borderColor: ${APPLE_YELLOW}

            style:
              background: ${APPLE_YELLOW}
              color: '#000000'
              fontSize: 9px
              fontWeight: 600

        # Power Up start boundary
        - x: ${POWER_UP_SESSION.start}
          borderColor: ${APPLE_YELLOW}
          strokeDashArray: 0

        # Power Up end boundary
        - x: ${POWER_UP_SESSION.end}
          borderColor: ${APPLE_YELLOW}
          strokeDashArray: 0

        # Current time marker
        - x: EVAL:Date.now()
          borderColor: ${CURRENT_COLOR}
          strokeDashArray: 0

          label:
            text: NOW
            orientation: horizontal
            offsetX: 20
            offsetY: -8
            borderColor: ${CURRENT_COLOR}

            style:
              background: ${CURRENT_COLOR}
              color: '#FFFFFF'
              fontSize: 10px
              fontWeight: 600


